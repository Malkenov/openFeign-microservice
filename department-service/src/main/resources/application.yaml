server:
  port: 8081

spring:
  application:
    name: department-service
  datasource:
    url: jdbc:postgresql://localhost:5432/department_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true